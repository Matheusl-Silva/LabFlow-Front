name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-e-smoke:
    name: Typecheck, build e smoke test
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build de produção
        run: npm run build

      - name: Subir e validar a aplicação
        run: |
          npm run start > app.log 2>&1 &
          echo $! > app.pid

          # Espera o next start responder na porta 3001
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/ || true)
            if [ "$code" = "200" ]; then
              echo "Aplicação de pé (tentativa $i)."
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::Aplicação não subiu em 30s"
              cat app.log
              exit 1
            fi
            sleep 1
          done

          # Páginas principais respondem
          for path in / /login /cadastro; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3001$path")
            if [ "$code" != "200" ]; then
              echo "::error::Rota $path deveria retornar 200, retornou $code"
              cat app.log; exit 1
            fi
            echo "OK: $path (200)"
          done

          # Headers de segurança do next.config.mjs estão sendo servidos
          headers=$(curl -sI http://localhost:3001/)
          for h in "X-Frame-Options" "X-Content-Type-Options" "Referrer-Policy" "Strict-Transport-Security"; do
            echo "$headers" | grep -qi "$h" || {
              echo "::error::Header de segurança ausente: $h"
              exit 1
            }
            echo "OK: header $h presente"
          done

      - name: Logs da aplicação (em caso de falha)
        if: failure()
        run: cat app.log || true

      - name: Encerrar aplicação
        if: always()
        run: kill "$(cat app.pid)" 2>/dev/null || true

  versionar:
    name: Calcular versão (semantic-release)
    runs-on: ubuntu-latest

    # Só versiona depois que typecheck, build e smoke test passaram, e apenas
    # em push direto na main — PR não deve criar release nem tag.
    needs: build-e-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write # criar a tag git e o release
      issues: write # comentar nas issues incluídas no release
      pull-requests: write

    outputs:
      # Fica vazio quando nenhum commit desde a última tag gera release
      # (ex.: só `ci:` ou `cleanup:`). O job seguinte trata esse caso.
      versao: ${{ steps.semantic.outputs.versao }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # semantic-release precisa do histórico e das tags
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rodar semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            -p semantic-release@24 \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            -p @semantic-release/github \
            -p @semantic-release/exec \
            semantic-release

  publicar-imagem:
    name: Publicar imagem no Docker Hub
    runs-on: ubuntu-latest
    needs: versionar

    env:
      IMAGE: matheus05/labflow-front
      VERSAO: ${{ needs.versionar.outputs.versao }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Montar lista de tags
        id: tags
        run: |
          # `latest` acompanha a main; a tag com o SHA permite voltar atrás para
          # um commit exato. A tag de versão só existe quando houve release.
          TAGS="${IMAGE}:latest,${IMAGE}:${GITHUB_SHA}"
          if [ -n "$VERSAO" ]; then
            TAGS="${TAGS},${IMAGE}:${VERSAO}"
            echo "Release ${VERSAO} — publicando tag de versão."
          else
            echo "Nenhum release neste push; publicando apenas latest e SHA."
          fi
          echo "lista=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # NEXT_PUBLIC_API_URL é embutido no bundle em tempo de build, então
          # precisa ser decidido aqui. Configurável em Settings > Variables;
          # sem a variable, cai no mesmo default do Dockerfile.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3000' }}
          tags: ${{ steps.tags.outputs.lista }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          echo "### Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tags.outputs.lista }}" | tr ',' '\n' \
            | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"
